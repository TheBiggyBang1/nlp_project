services:
  app:
    build: .
    container_name: pubmed-medical-nlp
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - ENTREZ_EMAIL=mehdihandous1@gmail.com
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
      - STREAMLIT_CLIENT_SHOWERRORDETAILS=true
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    stdin_open: true
    tty: true